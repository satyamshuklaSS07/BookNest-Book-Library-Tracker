<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Library Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <header>
    <div>
      <h1><span>📚</span> Book Library</h1>
      <p class="sub">Track what you've read, what you're reading, and what's next.</p>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">🌗</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="panel">
    <form id="form" autocomplete="off">
      <input id="title" placeholder="Book title" required maxlength="80" aria-label="Title">
      <input id="author" placeholder="Author" required maxlength="60" aria-label="Author">
      <select id="status" aria-label="Status">
        <option value="want">Want to read</option>
        <option value="reading">Reading</option>
        <option value="read">Read</option>
      </select>
      <button class="btn" id="submit" type="submit">Add book</button>
    </form>
  </section>

  <div class="bar">
    <div class="tabs" id="tabs" role="tablist">
      <div class="pill" id="pill"></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search…" aria-label="Search books">
      <select id="sort" aria-label="Sort">
        <option value="new">Newest</option>
        <option value="title">Title A–Z</option>
        <option value="rating">Top rated</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
